[project]
name = "compact-chat-engine"
version = "0.1.0"
description = "Compact memory chat engine with tiered tokenization and SQLite persistence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "openai>=3.9.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
compact-chat = "compact_chat_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
hf = [
    "transformers>=5.16.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

